[project]
name = "viemolyrics"
version = "0.2.0"
description = "A Corpus-Driven Computational Analysis of Emotion Dynamics in Vietnamese Song Lyrics"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Huy Nguyen", email = "research.nguyenduchuy@gmail.com" }
]
dependencies = [
    "ipykernel>=7.3.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "underthesea>=6.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
