<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViEmoLyrics - Công cụ Gán nhãn Pilot Khổ thơ (A/B Setup)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --joy: #10b981;
      --sadness: #3b82f6;
      --anticipation: #f59e0b;
      --trust: #8b5cf6;
      --fear: #f97316;
      --anger: #ef4444;
      --disgust: #854d0e;
      --surprise: #ec4899;
      --neutral: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 1.1rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 999px; background: #0369a1; color: #e0f2fe; }
    .nav-stats { display: flex; gap: 16px; align-items: center; font-size: 0.9rem; color: var(--text-muted); }
    .progress-bar-container { width: 140px; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    main { flex: 1; max-width: 900px; width: 100%; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .song-meta { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .song-title { font-size: 1.35rem; font-weight: 700; color: #fff; }
    .song-sub { font-size: 0.85rem; color: var(--text-muted); }

    .mode-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .mode-a { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .mode-b { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }

    .stanza-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px 24px;
      font-size: 1.25rem;
      line-height: 1.85;
      color: #f1f5f9;
      white-space: pre-wrap;
      font-serif: Georgia, Cambria, serif;
      margin-bottom: 20px;
      position: relative;
    }
    .repeat-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .section-title { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }

    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media (max-width: 640px) {
      .emotion-grid { grid-template-columns: 1fr; }
    }

    .btn-emo {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-emo:hover { background: #334155; border-color: #64748b; }
    .btn-emo .key-hint {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .btn-emo.selected {
      border-width: 2px;
      font-weight: 700;
    }
    .btn-emo.selected[data-emo="joy"] { border-color: var(--joy); background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .btn-emo.selected[data-emo="sadness"] { border-color: var(--sadness); background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .btn-emo.selected[data-emo="anticipation"] { border-color: var(--anticipation); background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .btn-emo.selected[data-emo="trust"] { border-color: var(--trust); background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
    .btn-emo.selected[data-emo="fear"] { border-color: var(--fear); background: rgba(249, 115, 22, 0.15); color: #fb923c; }
    .btn-emo.selected[data-emo="anger"] { border-color: var(--anger); background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .btn-emo.selected[data-emo="disgust"] { border-color: var(--disgust); background: rgba(133, 77, 14, 0.25); color: #d97706; }
    .btn-emo.selected[data-emo="surprise"] { border-color: var(--surprise); background: rgba(236, 72, 153, 0.15); color: #f472b6; }
    .btn-emo.selected[data-emo="neutral"] { border-color: var(--neutral); background: rgba(100, 116, 139, 0.15); color: #94a3b8; }

    .tags-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .tag-btn {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: #94a3b8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .tag-btn.active {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 600;
    }

    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #10b981; color: #0f172a; }
    .btn-success:hover { background: #059669; }

    /* Review Mode Stanza Cards */
    .review-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .review-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .review-item.changed { border-color: #c084fc; background: rgba(192, 132, 252, 0.05); }
    .review-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
    .review-text { font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; }
    .review-selector { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .review-select-btn {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      cursor: pointer;
    }
    .review-select-btn.active {
      border-color: #c084fc;
      background: rgba(192, 132, 252, 0.2);
      color: #e9d5ff;
      font-weight: 700;
    }

    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

"Ngày nắng ngày mưa sớm hôm ngược xuôi giữa đời", "Sống trong tay mẹ hiền, hết âu lo muộn phiền", "Mẹ đầy ơn phước cho muôn mái nhà ấm êm."], "line_count": 4, "word_count": 40, "is_repeated": false, "dup_of_stanza_idx": null, "emolex_baseline": "trust", "emolex_scores": {"anger": 0.0, "anticipation": 0.1111, "disgust": 0.0, "fear": 0.1111, "joy": 0.1111, "sadness": 0.2222, "surprise": 0.1111, "trust": 0.3333}}, {"stanza_id": "S15_3", "stanza_idx": 3, "text": "Xưa mẹ ủi an, lương giáo chung cảnh làm than\nLàng xóm Việt Nam có nhau tình sâu nghĩa đầy\nBốn phương chung một nhà, nghĩa anh em mặn mà\nMẹ thương liên kết muôn nơi chung hòa tiếng ca.", "lines": ["Xưa mẹ ủi an, lương giáo chung cảnh làm than", "Làng xóm Việt Nam có nhau tình sâu nghĩa đầy", "Bốn phương chung một nhà, nghĩa anh em mặn mà", "Mẹ thương liên kết muôn nơi chung hòa tiếng ca."], "line_count": 4, "word_count": 40, "is_repeated": false, "dup_of_stanza_idx": null, "emolex_baseline": "trust", "emolex_scores": {"anger": 0.0, "anticipation": 0.0, "disgust": 0.0, "fear": 0.1111, "joy": 0.1111, "sadness": 0.2222, "surprise": 0.0, "trust": 0.5556}}]}];

    // State management
    let state = {
      songIdx: 0,
      stanzaIdxInSong: 0,
      isReviewMode: false,
      annotations: {} // key: stanza_id -> { label_a, label_b, tags: [] }
    };

    // Load from localStorage if present
    const STORAGE_KEY = "viemolyrics_pilot_annotations_v1";
    function loadSavedState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = jsonParse(saved);
          state.annotations = parsed.annotations || {};
          state.songIdx = parsed.songIdx || 0;
          state.stanzaIdxInSong = parsed.stanzaIdxInSong || 0;
          state.isReviewMode = parsed.isReviewMode || false;
        } catch(e) {}
      }
    }
    function jsonParse(str) { return JSON.parse(str); }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const now = new Date();
      document.getElementById("save-status").innerText = "Đã lưu tự động lúc " + now.toLocaleTimeString();
    }

    function calculateGlobalStanzaIndex() {
      let count = 0;
      for (let i = 0; i < state.songIdx; i++) {
        count += PILOT_DATA[i].stanzas.length;
      }
      return count + state.stanzaIdxInSong + 1;
    }

    function getTotalStanzas() {
      return PILOT_DATA.reduce((acc, s) => acc + s.stanzas.length, 0);
    }

    function render() {
      const currentSong = PILOT_DATA[state.songIdx];
      const totalSongs = PILOT_DATA.length;
      const totalStanzas = getTotalStanzas();
      const currentGlobalStanza = calculateGlobalStanzaIndex();

      document.getElementById("stat-song").innerText = `Bài: ${state.songIdx + 1} / ${totalSongs}`;
      document.getElementById("stat-stanza").innerText = `Khổ: ${Math.min(currentGlobalStanza, totalStanzas)} / ${totalStanzas}`;
      const pct = (currentGlobalStanza / totalStanzas) * 100;
      document.getElementById("progress-bar").style.width = pct + "%";

      const container = document.getElementById("app-container");
      container.innerHTML = "";

      if (state.isReviewMode) {
        renderReviewMode(container, currentSong);
      } else {
        renderStanzaMode(container, currentSong);
      }
      saveState();
    }

    function renderStanzaMode(container, song) {
      const stanza = song.stanzas[state.stanzaIdxInSong];
      const stanzaId = stanza.stanza_id;
      const curData = state.annotations[stanzaId] || { label_a: null, label_b: null, tags: [] };

      const card = document.createElement("div");
      card.className = "card";

      let repeatBadge = "";
      if (stanza.is_repeated) {
        repeatBadge = `<div class="repeat-tag">🔁 Khổ điệp khúc lặp lại (từ Khổ ${stanza.dup_of_stanza_idx})</div>`;
      }

      card.innerHTML = `
        <div class="song-meta">
          <div>
            <div class="song-title">${song.title}</div>
            <div class="song-sub">Nhạc sĩ: ${song.composer} | Thể loại: ${song.category}</div>
          </div>
          <div style="font-size: 0.9rem; color: #94a3b8;">
            Khổ ${state.stanzaIdxInSong + 1} / ${song.stanzas.length}
          </div>
        </div>

        <div class="mode-indicator mode-a">
          <span>🔍 BƯỚC 1: ĐÁNH GIÁ CỤC BỘ KHỔ THƠ (SETUP A)</span>
          <span style="font-weight: 400; color: #94a3b8;">- Chỉ đọc riêng khổ này và chọn cảm xúc biểu đạt</span>
        </div>

        <div class="stanza-box">
          ${repeatBadge}
          ${escapeHtml(stanza.text)}
        </div>

        <div class="section-title">Chọn Cảm xúc Nổi bật của Khổ này (bấm phím 1..8 hoặc 0):</div>
        <div class="emotion-grid" id="emo-grid"></div>

        <div class="section-title">Đặc điểm ngôn ngữ nhận thấy trong khổ (tùy chọn):</div>
        <div class="tags-row" id="tags-row">
          <div class="tag-btn ${curData.tags.includes('phu_dinh') ? 'active' : ''}" onclick="toggleTag('${stanzaId}', 'phu_dinh')">[N] Phủ định (không/chưa/chẳng/hết...)</div>
          <div class="tag-btn ${curData.tags.includes('an_du') ? 'active' : ''}" onclick="toggleTag('${stanzaId}', 'an_du')">[M] Ẩn dụ thi ca (mưa/đò/chiều/lá/sương...)</div>
          <div class="tag-btn ${curData.tags.includes('tuong_phan') ? 'active' : ''}" onclick="toggleTag('${stanzaId}', 'tuong_phan')">[C] Mệnh đề tương phản (ngày xưa... giờ đây / dù... nhưng)</div>
        </div>

        <div class="action-bar">
          <button class="btn btn-secondary" onclick="prevStanza()" ${state.songIdx === 0 && state.stanzaIdxInSong === 0 ? 'disabled style="opacity:0.4;"' : ''}>← Quay lại</button>
          <button class="btn btn-primary" onclick="nextStanza()">Lưu & Tiếp theo →</button>
        </div>
      `;

      container.appendChild(card);

      const grid = card.querySelector("#emo-grid");
      EMOTIONS.forEach(emo => {
        const btn = document.createElement("div");
        btn.className = "btn-emo" + (curData.label_a === emo.id ? " selected" : "");
        btn.setAttribute("data-emo", emo.id);
        btn.onclick = () => selectEmotion(stanzaId, emo.id);
        btn.innerHTML = `
          <div>
            <div style="font-weight: 600;">${emo.vi}</div>
            <div style="font-size: 0.75rem; color: #94a3b8;">${emo.desc}</div>
          </div>
          <span class="key-hint">${emo.num}</span>
        `;
        grid.appendChild(btn);
      });
    }

    function renderReviewMode(container, song) {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="song-meta">
          <div>
            <div class="song-title">${song.title}</div>
            <div class="song-sub">Nhạc sĩ: ${song.composer} | Thể loại: ${song.category}</div>
          </div>
          <div style="font-size: 0.9rem; color: #a78bfa; font-weight: 600;">
            Hoàn tất các khổ bài ${state.songIdx + 1} / ${PILOT_DATA.length}
          </div>
        </div>

        <div class="mode-indicator mode-b">
          <span>📖 BƯỚC 2: SOI TRONG NGỮ CẢNH TOÀN BÀI (SETUP B)</span>
          <span style="font-weight: 400; color: #cbd5e1;">- Đọc mạch toàn bài xem có khổ nào bạn muốn đổi nhãn không</span>
        </div>

        <div class="review-container" id="review-list"></div>

        <div class="action-bar">
          <button class="btn btn-secondary" onclick="backToStanzaEdit()">← Xem lại từng khổ</button>
          <button class="btn btn-success" onclick="confirmSongReview()">Xác nhận bài này & Sang bài tiếp theo →</button>
        </div>
      `;

      container.appendChild(card);

      const list = card.querySelector("#review-list");
      song.stanzas.forEach((stanza, idx) => {
        const stanzaId = stanza.stanza_id;
        const curData = state.annotations[stanzaId] || { label_a: null, label_b: null, tags: [] };
        const labelA = curData.label_a || "neutral";
        const labelB = curData.label_b || labelA; // Default to labelA if not changed

        const isChanged = labelB !== labelA;

        const item = document.createElement("div");
        item.className = "review-item" + (isChanged ? " changed" : "");
        item.innerHTML = `
          <div class="review-header">
            <span><strong>Khổ ${idx + 1}</strong> (${stanza.word_count} từ)${stanza.is_repeated ? ' - [Lặp lại]' : ''}</span>
            <span>Nhãn ban đầu (Setup A): <span style="color:#38bdf8; font-weight:600;">${getEmotionLabel(labelA)}</span></span>
          </div>
          <div class="review-text">${escapeHtml(stanza.text)}</div>
          <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Khi nhìn toàn bài, cảm xúc khổ này là:</div>
          <div class="review-selector" id="sel-${stanzaId}"></div>
        `;
        list.appendChild(item);

        const sel = item.querySelector(`#sel-${stanzaId}`);
        EMOTIONS.forEach(emo => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "review-select-btn" + (labelB === emo.id ? " active" : "");
          btn.innerText = emo.vi.split(" ")[0]; // short name
          btn.title = emo.vi;
          btn.onclick = () => {
            curData.label_b = emo.id;
            state.annotations[stanzaId] = curData;
            render();
          };
          sel.appendChild(btn);
        });
      });
    }

    function selectEmotion(stanzaId, emoId) {
      if (!state.annotations[stanzaId]) {
        state.annotations[stanzaId] = { label_a: null, label_b: null, tags: [] };
      }
      state.annotations[stanzaId].label_a = emoId;
      state.annotations[stanzaId].label_b = emoId; // Default B to A
      render();
    }

    function toggleTag(stanzaId, tag) {
      if (!state.annotations[stanzaId]) {
        state.annotations[stanzaId] = { label_a: null, label_b: null, tags: [] };
      }
      const tags = state.annotations[stanzaId].tags || [];
      const idx = tags.indexOf(tag);
      if (idx >= 0) {
        tags.splice(idx, 1);
      } else {
        tags.push(tag);
      }
      state.annotations[stanzaId].tags = tags;
      render();
    }

    function nextStanza() {
      const currentSong = PILOT_DATA[state.songIdx];
      const stanza = currentSong.stanzas[state.stanzaIdxInSong];
      const curData = state.annotations[stanza.stanza_id];
      if (!curData || !curData.label_a) {
        alert("Vui lòng chọn 1 nhãn cảm xúc cho khổ này (hoặc bấm 0 nếu không rõ) trước khi tiếp tục!");
        return;
      }

      if (state.stanzaIdxInSong < currentSong.stanzas.length - 1) {
        state.stanzaIdxInSong++;
      } else {
        // Finished all stanzas of this song -> go to Review Mode (Setup B)
        state.isReviewMode = true;
      }
      render();
    }

    function prevStanza() {
      if (state.stanzaIdxInSong > 0) {
        state.stanzaIdxInSong--;
      } else if (state.songIdx > 0) {
        state.songIdx--;
        state.stanzaIdxInSong = PILOT_DATA[state.songIdx].stanzas.length - 1;
      }
      state.isReviewMode = false;
      render();
    }

    function backToStanzaEdit() {
      state.isReviewMode = false;
      state.stanzaIdxInSong = PILOT_DATA[state.songIdx].stanzas.length - 1;
      render();
    }

    function confirmSongReview() {
      if (state.songIdx < PILOT_DATA.length - 1) {
        state.songIdx++;
        state.stanzaIdxInSong = 0;
        state.isReviewMode = false;
        render();
      } else {
        alert("Chúc mừng bạn! Bạn đã hoàn thành toàn bộ 15 bài hát (62 khổ thơ) của tập Pilot! Hãy bấm 'Tải kết quả JSON' hoặc 'Tải CSV' ở góc trên để gửi nhé!");
        render();
      }
    }

    function getEmotionLabel(id) {
      const found = EMOTIONS.find(e => e.id === id);
      return found ? found.vi : id;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Keyboard handlers
    window.addEventListener("keydown", (e) => {
      if (state.isReviewMode) return;
      const key = e.key;
      const currentSong = PILOT_DATA[state.songIdx];
      const stanza = currentSong.stanzas[state.stanzaIdxInSong];
      const stanzaId = stanza.stanza_id;

      const emo = EMOTIONS.find(m => m.num === key);
      if (emo) {
        selectEmotion(stanzaId, emo.id);
        return;
      }
      if (key === "Enter" || key === "ArrowRight") {
        nextStanza();
      } else if (key === "ArrowLeft") {
        prevStanza();
      } else if (key.toLowerCase() === "n") {
        toggleTag(stanzaId, "phu_dinh");
      } else if (key.toLowerCase() === "m") {
        toggleTag(stanzaId, "an_du");
      } else if (key.toLowerCase() === "c") {
        toggleTag(stanzaId, "tuong_phan");
      }
    });

    // Export functions
    function buildExportRecords() {
      const records = [];
      PILOT_DATA.forEach(song => {
        song.stanzas.forEach(st => {
          const ann = state.annotations[st.stanza_id] || {};
          records.append ? null : records.push({
            song_id: song.song_id,
            title: song.title,
            category: song.category,
            composer: song.composer,
            stanza_id: st.stanza_id,
            stanza_idx: st.stanza_idx,
            total_stanzas: song.total_stanzas,
            is_repeated: st.is_repeated,
            dup_of_stanza_idx: st.dup_of_stanza_idx,
            stanza_text: st.text,
            label_setup_a: ann.label_a || "",
            label_setup_b: ann.label_b || ann.label_a || "",
            is_changed_in_context: (ann.label_b && ann.label_b !== ann.label_a) || false,
            linguistic_tags: (ann.tags || []).join(";"),
            emolex_baseline: st.emolex_baseline
          });
        });
      });
      return records;
    }

    function exportJSON() {
      const records = buildExportRecords();
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pilot_annotations_15songs.json";
      a.click();
    }

    function exportCSV() {
      const records = buildExportRecords();
      if (!records.length) return;
      const headers = Object.keys(records[0]);
      const csvRows = [headers.join(",")];
      records.forEach(r => {
        const values = headers.map(h => {
          let val = (r[h] === null || r[h] === undefined) ? "" : String(r[h]);
          val = val.replace(/"/g, '""');
          return `"${val}"`;
        });
        csvRows.push(values.join(","));
      });
      const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pilot_annotations_15songs.csv";
      a.click();
    }

    // Initialize
    loadSavedState();
    render();
  </script>
